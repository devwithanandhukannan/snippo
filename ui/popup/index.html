<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SayMore</title>
  <script type="module" crossorigin src="../../assets/popup.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/store.js">
  <link rel="modulepreload" crossorigin href="../../assets/matcher.js">
  <link rel="stylesheet" crossorigin href="../../assets/store.css">
  <link rel="stylesheet" crossorigin href="../../assets/popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header: Logo, Pause switch, and New Snippet button -->
    <header class="popup-header">
      <div class="brand-group" title="Open All Snippets Workspace">
        <div class="brand-logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="popup-brand-clip">
                <rect x="1.5" y="1.5" width="29" height="29" rx="7.1"/>
              </clipPath>
              <linearGradient id="popup-blue-grad" x1="7.5" y1="1.5" x2="24.5" y2="30.5" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#3296FD"/>
                <stop offset="100%" stop-color="#1872DE"/>
              </linearGradient>
            </defs>
            <g clip-path="url(#popup-brand-clip)">
              <rect x="1.5" y="1.5" width="29" height="29" fill="url(#popup-blue-grad)"/>
              <path d="M 16.75 10.25 L 30.5 24 L 30.5 30.5 L 21.75 30.5 L 6.25 17.5 L 10.6 17.1 L 12.25 17.1 L 16.75 17.1 Z" fill="#1058B8" fill-opacity="0.32"/>
              <path d="M 17.4 23.95 L 24 30.5 L 30.5 30.5 L 30.5 27.4 L 26.15 23.95 Z" fill="#0D4FA8" fill-opacity="0.25"/>
              <path d="M 6.1 17.1 L 6.1 13.4 C 6.1 10.1 8 8.5 10.1 8.5 L 10.6 10.25 C 9.1 10.4 8.25 11.4 8.25 13 L 10.5 13 L 10.5 17.1 Z" fill="#FFFFFF"/>
              <path d="M 12.25 17.1 L 12.25 13.4 C 12.25 10.1 14.1 8.5 16.25 8.5 L 16.75 10.25 C 15.25 10.4 14.4 11.4 14.4 13 L 16.6 13 L 16.6 17.1 Z" fill="#FFFFFF"/>
              <rect x="17.4" y="21.75" width="8.75" height="2.2" rx="0.5" fill="#FFFFFF"/>
            </g>
          </svg>
        </div>
        <div class="brand-info">
          <h1 class="brand-title">saymore<span class="brand-slash">/</span></h1>
          <span class="brand-tagline" id="site-status-text">Active</span>
        </div>
      </div>
      <div class="header-actions">
        <!-- Pause on this site toggle -->
        <label class="switch" title="Pause SayMore on this site">
          <input type="checkbox" id="site-toggle" checked>
          <span class="slider"></span>
        </label>
        <!-- Primary Action (Fitts's Law) -->
        <button class="btn btn-primary btn-sm" id="btn-quick-new" title="Create new snippet">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New
        </button>
      </div>
    </header>

    <!-- Search input -->
    <div class="search-box">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="popup-search" class="search-input" placeholder="Search triggers or snippets..." autofocus>
      <span class="search-shortcut" id="snippet-count-badge">0</span>
    </div>

    <!-- Snippets list -->
    <div class="snippets-container" id="snippets-list">
      <!-- Dynamically rendered snippet cards -->
      <div class="empty-state" id="empty-state" style="display: none;">
        <p class="empty-title">No matching snippets</p>
        <p class="empty-desc">Create one with the "+ New" button above.</p>
      </div>
    </div>


    <!-- Footer: Open Manager link -->
    <footer class="popup-footer">
      <span class="footer-privacy">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        100% Local &amp; Private
      </span>
      <button class="btn btn-ghost btn-sm" id="btn-open-manager">
        Open Workspace
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </footer>
  </div>

</body>
</html>
