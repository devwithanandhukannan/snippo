<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SayMore</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <link rel="stylesheet" href="../design-system/components.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header: Logo, Pause switch, and New Snippet button -->
    <header class="popup-header">
      <div class="brand-group" title="Open All Snippets Workspace">
        <div class="brand-logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="popup-brand-clip">
                <rect width="32" height="32" rx="8.5"/>
              </clipPath>
            </defs>
            <g clip-path="url(#popup-brand-clip)">
              <rect width="32" height="32" fill="#5B5BD6"/>
              <rect width="32" height="16" fill="#6D63E6"/>
              <line x1="19.5" y1="8" x2="11.5" y2="24" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="23.5" y1="14" x2="23.5" y2="24" stroke="#3DDC97" stroke-width="3.5" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
        <div class="brand-info">
          <h1 class="brand-title">saymore<span class="brand-slash">/</span></h1>
          <span class="brand-tagline" id="site-status-text">Active</span>
        </div>
      </div>
      <div class="header-actions">
        <!-- Pause on this site toggle -->
        <label class="switch" title="Pause SayMore on this site">
          <input type="checkbox" id="site-toggle" checked>
          <span class="slider"></span>
        </label>
        <!-- Primary Action (Fitts's Law) -->
        <button class="btn btn-primary btn-sm" id="btn-quick-new" title="Create new snippet">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New
        </button>
      </div>
    </header>

    <!-- Search input -->
    <div class="search-box">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="popup-search" class="search-input" placeholder="Search triggers or snippets..." autofocus>
      <span class="search-shortcut" id="snippet-count-badge">0</span>
    </div>

    <!-- Snippets list -->
    <div class="snippets-container" id="snippets-list">
      <!-- Dynamically rendered snippet cards -->
      <div class="empty-state" id="empty-state" style="display: none;">
        <p class="empty-title">No matching snippets</p>
        <p class="empty-desc">Create one with the "+ New" button above.</p>
      </div>
    </div>


    <!-- Footer: Open Manager link -->
    <footer class="popup-footer">
      <span class="footer-privacy">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        100% Local &amp; Private
      </span>
      <button class="btn btn-ghost btn-sm" id="btn-open-manager">
        Open Workspace
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
